<!DOCTYPE html>
<html lang=""tr"">
<head>
    <meta charset=""UTF-8"">
    <meta name=""viewport"" content=""width=device-width, initial-scale=1.0"">
    <title>Feature Graphic</title>
    <link href=""https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap"" rel=""stylesheet"">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #2c3e50;
            height: 100vh;
        }
        .canvas {
            width: 1024px;
            height: 500px;
            background: linear-gradient(135deg, #FF9A9E 0%, #FECFEF 99%, #FECFEF 100%);
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            border-radius: 0px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            padding: 0 60px;
            box-sizing: border-box;
        }
        
        /* Floating background elements */
        .bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
        }
        .b1 { width: 150px; height: 150px; top: -50px; right: 100px; }
        .b2 { width: 300px; height: 300px; bottom: -100px; right: -50px; }
        .b3 { width: 80px; height: 80px; top: 100px; left: 400px; }
        .b4 { width: 200px; height: 200px; bottom: -50px; left: -50px; }

        .emoji {
            position: absolute;
            font-size: 60px;
            opacity: 0.8;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }
        .e1 { top: 40px; left: 450px; transform: rotate(-15deg); }
        .e2 { bottom: 60px; left: 420px; transform: rotate(15deg); }
        .e3 { top: 60px; right: 80px; font-size: 80px; transform: rotate(20deg); }
        .e4 { bottom: 80px; right: 150px; font-size: 70px; transform: rotate(-10deg); }

        .logo-container {
            z-index: 10;
            margin-right: 50px;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.2));
            border-radius: 25%;
            overflow: hidden;
            width: 320px;
            height: 320px;
            border: 8px solid white;
            background-color: white;
        }
        
        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 20%;
        }

        .text-container {
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 500px;
        }

        .title {
            font-family: 'Fredoka One', cursive;
            font-size: 72px;
            color: #2b3a4a;
            line-height: 1.1;
            text-shadow: 2px 2px 0px white, -2px -2px 0px white, 2px -2px 0px white, -2px 2px 0px white, 0 8px 15px rgba(0,0,0,0.1);
        }

        .subtitle {
            font-family: 'Nunito', sans-serif;
            font-size: 38px;
            font-weight: 900;
            color: #FF5722;
            background: white;
            padding: 10px 24px;
            border-radius: 50px;
            display: inline-block;
            align-self: flex-start;
            box-shadow: 0 8px 20px rgba(255, 87, 34, 0.3);
            border: 4px solid #FF5722;
            margin-top: 15px;
        }

        .badges {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        
        .badge {
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            background: #FFCA28;
            color: #333;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class=""canvas"" id=""capture"">
        <!-- Background Elements -->
        <div class=""bubble b1""></div>
        <div class=""bubble b2""></div>
        <div class=""bubble b3""></div>
        <div class=""bubble b4""></div>
        
        <div class=""emoji e1"">🚀</div>
        <div class=""emoji e2"">🧠</div>
        <div class=""emoji e3"">🎨</div>
        <div class=""emoji e4"">➕</div>

        <!-- Logo -->
        <div class=""logo-container"">
            <!-- Loading from absolute path for local file viewing -->
            <img src=""assets/icon.jpg"" alt=""Logo"">
        </div>

        <!-- Text -->
        <div class=""text-container"">
            <div class=""title"">KidsEduApp</div>
            <div class=""subtitle"">Eğitici Çocuk Uygulaması</div>
            <div class=""badges"">
                <div class=""badge"">💯 Reklamsız</div>
                <div class=""badge"">🛡️ Güvenli</div>
                <div class=""badge"">🇹🇷 Türkçe</div>
            </div>
        </div>
    </div>

</body>
</html>
